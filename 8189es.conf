# Recommended module configuration for SmartChip S9082C / S9082xs (02E7:9082) Wi-Fi
#
# rtw_s9082_disable_phydm=0: Enables PHYDM Rate Adaptation Watchdog (achieves 22-25.5 MBit/s real throughput)
# rtw_power_mgnt=0: Disables power management to prevent latency spikes and connection drops
options 8189es rtw_s9082_disable_phydm=0 rtw_power_mgnt=0
